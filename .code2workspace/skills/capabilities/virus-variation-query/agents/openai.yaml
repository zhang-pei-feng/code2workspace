interface:
  display_name: "病毒变异数据库查询"
  short_description: "查询本机 virus_variation 主库，以及可选 covid19_data 谱系/突变/导入镜像"
  default_prompt: >-
    Use $virus-variation-query for local virus variation database questions, including Chinese prompts such as
    `查数据库`, `查库`, `数据库里`, `virus_variation`, `本地变异库`, `突变风险库`, `位点风险`, `RBD 区域`,
    `S蛋白`, `HA`, `NA`, `氨基酸突变`, `抗体逃逸`, `ACE2`, `受体结合`, `毒株`, `谱系`, `lineage`,
    `strain`, and examples like `PQ.2 毒株在 RBD 区域上有哪些氨基酸突变`. This skill uses the local
    MySQL database `virus_variation` as the primary evidence layer. It contains the SARS-CoV-2,
    influenza, and mpox site-level risk tables plus `ncov_lineage_mutations`,
    `ncov_lineage_catalog`, `ncov_source_records`, and import-run tables. A legacy mirror named
    `covid19_data` contains only some lineage/source tables and should be used only for explicit
    comparison or fallback. Before writing SQL, read
    `skills/capabilities/virus-variation-query/SKILL.md` and use only the documented
    read-only connection patterns. Use root via sudo/auth_socket, for example
    `printf '%s\n' 'zhangpf12345' | sudo -S -p '' mysql -uroot virus_variation -e "SQL"`.
    Do not use the old nonexistent `agent_virus` credentials, do not invent placeholder credentials
    such as your_user/your_password, and do not invent schema fields.
    Confirm schema with SHOW TABLES or DESCRIBE if uncertain. The
    `virus_variation.ncov_amino_acid_risk` table is a site-level risk table and does not contain
    lineage/strain/region/mutation columns. If the user asks for actual lineage-defining mutations,
    first query `virus_variation.ncov_lineage_mutations`;
    for Spike/RBD use `(gene IN ('S','SPIKE') OR LOWER(raw_site) LIKE 's:%' OR LOWER(raw_site)
    LIKE 'spike:%')` and RBD positions 319-541. Then query `virus_variation.ncov_amino_acid_risk`
    for ACE2/antibody risk scores on the matched S positions. If the primary database has no
    matching lineage rows, optionally check `covid19_data.ncov_lineage_mutations`; if still absent,
    clearly state that local lineage coverage limitation and use appropriate external
    lineage/literature/monitoring sources when needed. For generic variant/vaccine/immune-barrier/
    clinical-trial/risk-assessment prompts, include this skill as the local site-level risk and
    lineage-mutation evidence layer alongside academic_search for papers/trials and
    respiratory-disease-data-fetcher or official web monitoring for recent surveillance context.
