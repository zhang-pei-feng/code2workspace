display_name: Academic Search
short_description: Search PubMed, Springer, and bioRxiv papers reliably, with optional abstracts/details
default_prompt: Use $academic-search as the preferred path for PubMed, paper, literature, reference, abstract, vaccine, drug, SARS-CoV-2, influenza, RSV, virology, biology, medicine, and bioinformatics retrieval requests, including Chinese prompts such as `根据最新论文信息`, `基于最新论文`, `最新论文显示`, `最新文献显示`, `结合最新研究`, `查最新论文`, `找最新文献`, `找论文`, `查论文`, `检索文献`, `文献检索`, `找几篇`, `推荐几篇文章`, `相关研究`, `研究进展`, `综述`, `临床试验`, `进入临床`, `疫苗临床`, `中和实验`, `预印本`, `摘要`, `作者`, `期刊`, `DOI`, `PMID`, `参考文献`, and `引用`. For prompts containing `根据最新论文信息`, `基于最新论文`, `最新论文显示`, `最新文献显示`, `结合最新研究`, `查最新论文`, or `找最新文献`, run `python3 skills/academic-search/scripts/search_tools.py ...` from the workspace root before web_search and do not answer from news snippets alone. For prompts like `找几篇 sars-cov2 疫苗药物研究的最新论文，以 nature 等高影响因子的结果为主`, prefer PubMed with strict title/journal filters such as `((SARS-CoV-2[Title] OR COVID-19[Title]) AND (vaccine[Title] OR vaccination[Title] OR antiviral[Title] OR inhibitor[Title] OR drug[Title] OR Paxlovid[Title]) AND (Nature Communications[Journal] OR NPJ Vaccines[Journal] OR Nature Medicine[Journal] OR Communications Medicine[Journal]))`; do not use broad Springer queries as primary evidence unless you manually filter out unrelated BMC/RSV/cancer records. For generic variant/vaccine/immune-barrier/clinical-trial/risk-assessment prompts, use this skill as the literature/trial evidence layer alongside virus-variation-query for local site-risk context and respiratory-disease-data-fetcher or official web monitoring for recent surveillance context; if a layer cannot answer directly, mention that limitation instead of silently omitting it. Pass --max-results when the user requests a specific count, pass --details when the user asks for abstracts, authors, journal/source, DOI, specific paper content, or detailed information, avoid web_search when forbidden, and if the script returns an error report it plainly instead of silently switching to another retrieval path. Use PubMed, Springer, and bioRxiv as appropriate; bioRxiv can be used as supporting preprint evidence, but when it is queried by date window filter returned records for actual relevance and clearly label the source/preprint status. Do not use this skill for local virus_variation SQL/risk-score queries or official WHO/CDC/China CDC surveillance data as the only source unless the user explicitly asks only for literature. When answering from this skill, append a short `信息来源` section at the end that lists only the sources actually used in the final answer, such as `skill: academic-search (PubMed)`, `skill: academic-search (Springer Nature)`, or `skill: academic-search (bioRxiv)`. Keep it coarse-grained, 1-3 bullets, and do not invent sources or add footnote-style citations.
