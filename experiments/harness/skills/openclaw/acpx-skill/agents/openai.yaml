display_name: ACPX Agent Bridge
short_description: Route tasks to benchmark_agent, data_governance_agent, deep_research_agent, report_agent, or code2workspace_agent via the workspace acpx config. code2workspace_agent must use acpx one-shot routing, never sessions_spawn.
default_prompt: Choose the right acpx agent for this request, use the local `skills/acpx-skill/.acpxrc.json` config, and return only the bridged agent's final reply. If the user mentions code2workspace, code2workspace_agent, paper2workspace, 仓库转 workspace, 代码转 workspace, 生成 workspace, workspace 产物, 生成/编写 WDL, docker_images-agent, or wdl_run-agent in a repo-to-workspace task, use code2workspace_agent through shell exec/acpx only. Do not use sessions_spawn for code2workspace_agent, docker_images-agent, or wdl_run-agent; docker_images-agent and wdl_run-agent are internal roles owned by code2workspace_agent. Forward the user's original code2workspace task as one complete prompt to code2workspace_agent; do not split it into separate Docker and WDL prompts in the main OpenClaw session. Preferred code2workspace command is `python3 skills/acpx-skill/scripts/acpx_session.py route --agent code2workspace_agent --prompt "<task>"`; direct form is `acpx --cwd skills/acpx-skill --format text --timeout 7200 code2workspace_agent exec "<task>"`. For real code2workspace tasks, use outer exec timeout above 7300 seconds and yieldMs around 7200000; if it returns `Command still running` or `Process still running`, keep polling until completion, failure, or timeout. If code2workspace_agent fails or times out, report that failure and do not replace it with hand-written Dockerfile/WDL/git/docker commands in the main session. If the user asks to 生成/撰写/写 a 报告 or 风险评估报告, use report_agent only, one-shot. Do not call benchmark_agent in parallel for report generation, even when the report needs analysis, data lookup, comparison, or risk assessment. Correct report command form is `acpx --cwd skills/acpx-skill --format text --timeout 1800 report_agent exec "<task>"`; `acpx ... exec` accepts the prompt as a positional argument or with `-f/--file`, so never use nonexistent options such as `--task`, `--workspace`, or `--input`. If the user asks for a benchmark / compare / 工作流复用 / 复用工作流 / 复用已有 workflow task, interpret that as a request to use exec via acpx benchmark_agent rather than sessions_spawn. For benchmark_agent workflow-reuse tasks, use acpx timeout 3600, outer exec timeout above 3700 seconds, and a long yield window around 3600000 ms; if it returns `Command still running` or `Process still running`, keep polling until completion, failure, or timeout. Reuse session aliases only when the saved session is clean and idle. External ACP runner locations should be provided via `OPENCLAW_EXTERNAL_AGENTS_ROOT` or the specific `*_ACP_COMMAND` environment variables defined by this skill, rather than hard-coded paths. For benchmark_agent, use one-shot exec for short chat or probe prompts. If the saved alias is busy or stale, also fall back to one-shot exec instead of queueing behind the old session. If sessions_spawn is denied by policy for benchmark_agent, immediately switch to exec/acpx. For deep_research_agent research tasks, use acpx timeout 300 and do not shorten it. If the bridged agent times out or fails, report that failure and do not replace it with your own answer. For report_agent, if the process session is lost or returns `No session found`, check `${REPORT_AGENT_REPORTS_ROOT}/latest_report.md`, `${REPORT_AGENT_REPORTS_ROOT}/latest/final_report.md`, and `${REPORT_AGENT_REPORTS_ROOT}/report_*/final_report.md` before retrying or declaring failure. For report_agent, the user-facing answer must include the full report body; if the bridged agent returns only `报告文件:` / `final_report.md` / a `.../reports/...` path, read that local file and send its contents instead of giving the user the server path. When the bridged agent returns a usable result, append a short `信息来源` section that identifies the actual external agent used, such as `外部智能体: code2workspace_agent`, `外部智能体: report_agent`, `外部智能体: deep_research_agent` or `外部智能体: data_governance_agent`, and mention linked web sources only if they are part of the final answer. Keep this source note coarse-grained and do not invent extra provenance.
