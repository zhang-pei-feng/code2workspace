[experiment]
name = "benchmark-repo-harness"
workspace_root = ".workspaces/oneshot"
output_root = "results/harness/benchmark_repo_harness"
max_iterations = 3
repo_splits = "experiments/harness/configs/repo_splits.toml"
default_max_runtime_minutes = 90

