[repo_case_runtime_minutes]
spades = 120
canu = 180
megahit = 120
Flye = 120
trinityrnaseq = 120
v-pipe = 90
covid-19-signal = 90
fieldbioinformatics = 90

[surfaces.one_shot_prompt]
kind = "workspace_file"
target = "experiments/harness/surfaces/one_shot_prompt.txt"
filename = "one_shot_prompt.txt"
base_file = "experiments/harness/surfaces/one_shot_prompt.txt"

[surfaces.completion_rubric]
kind = "workspace_file"
target = "experiments/harness/surfaces/completion_rubric.txt"
filename = "completion_rubric.txt"
base_file = "experiments/harness/surfaces/completion_rubric.txt"
