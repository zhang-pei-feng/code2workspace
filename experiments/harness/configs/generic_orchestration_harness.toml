[experiment]
name = "generic-orchestration-harness"
output_root = "experiments/harness/runs"
max_iterations = 2
max_parallel_cases = 1

[[cases]]
case_id = "generic-trace-artifacts-train"
split = "train"
weight = 1.0
max_runtime_minutes = 8
prompt = "请只基于本地代码，说明 generic trace run 现在会记录哪些关键 artifact，并给出 raw worker trace 的环境变量开关名。回答简短。"

[[cases]]
case_id = "generic-eval-scores-train"
split = "train"
weight = 1.0
max_runtime_minutes = 8
prompt = "请只基于本地代码，说明 generic evaluation 里的六个 score 分别是什么、各自大概在衡量什么。尽量简短。"

[[cases]]
case_id = "generic-optimization-gap-train"
split = "train"
weight = 1.0
max_runtime_minutes = 8
prompt = "请只基于本地代码，判断在真正实现 generic harness 自动优化闭环之前，还缺了哪几个关键环节。回答简短。"

[[cases]]
case_id = "generic-trace-vs-tool-activity-holdout"
split = "holdout"
weight = 1.0
max_runtime_minutes = 8
prompt = "请只基于本地代码，解释 worker tool activity 和 raw worker trace 各自记录什么、两者差别是什么。保持口语化。"

[[cases]]
case_id = "generic-unknown-tool-fix-holdout"
split = "holdout"
weight = 1.0
max_runtime_minutes = 8
prompt = "请只基于本地代码，说明 tool_activity.jsonl 里早先的 unknown tool event 是怎么来的，后来又是怎么修掉的。回答简短。"

[[cases]]
case_id = "generic-skill-evolution-chain-holdout"
split = "holdout"
weight = 1.0
max_runtime_minutes = 8
prompt = "请只基于本地代码，给我一个简短结论：generic harness 现在是真的在做 skill 进化了吗？如果是，链路是什么。"

[[cases]]
case_id = "generic-spring-festival-covid-scorecard"
split = "scorecard"
weight = 1.0
max_runtime_minutes = 15
prompt = "2026 年初的春运人口流动是否促进了新冠传播？先给我一个口头判断，不要正式写作，但要说明证据边界。"

[[cases]]
case_id = "generic-covid-flu-peak-scorecard"
split = "scorecard"
weight = 1.0
max_runtime_minutes = 15
prompt = "下一波新冠/流感阳性率的高峰会在什么时间？先给我一个口头判断，不要正式写作，但要说明证据边界。"

[[cases]]
case_id = "generic-ba32-xfg-severity-scorecard"
split = "scorecard"
weight = 1.0
max_runtime_minutes = 15
prompt = "BA.3.2 和 XFG 毒株的子代中，哪一种会导致临床重症率增加？先帮我分析一下，区分证据和猜测，不要正式写作。"
