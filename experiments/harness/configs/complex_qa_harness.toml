[experiment]
name = "complex-qa-harness"
batch_file = "experiments/skill_tests/batches/complex-qa-suite-v1.md"
output_root = "results/harness"
max_iterations = 3
max_parallel_cases = 4

[proposer]
command = [
  "python3",
  "experiments/harness/proposers/complex_qa_surface_proposer.py",
]
max_runtime_minutes = 20

[surfaces.planning_skill]
kind = "workspace_file"
target = ".code2workspace/skills/planning-guide/SKILL.md"
filename = "planning-guide-SKILL.md"
base_file = ".code2workspace/skills/planning-guide/SKILL.md"

[surfaces.planning_source_selection]
kind = "workspace_file"
target = ".code2workspace/skills/planning-guide/references/source-selection.md"
filename = "planning-guide-source-selection.md"
base_file = ".code2workspace/skills/planning-guide/references/source-selection.md"

[surfaces.planning_cross_source_case]
kind = "workspace_file"
target = ".code2workspace/skills/planning-guide/references/case-cross-source-synthesis.md"
filename = "planning-guide-case-cross-source-synthesis.md"
base_file = ".code2workspace/skills/planning-guide/references/case-cross-source-synthesis.md"

[surfaces.planning_tool]
kind = "workspace_file"
target = ".code2workspace/skills/planning-guide/scripts/planning_tool.py"
filename = "planning-guide-tool.py"
base_file = ".code2workspace/skills/planning-guide/scripts/planning_tool.py"

[surfaces.academic_search_skill]
kind = "workspace_file"
target = ".code2workspace/skills/academic-search/SKILL.md"
filename = "academic-search-SKILL.md"
base_file = ".code2workspace/skills/academic-search/SKILL.md"

[surfaces.respiratory_fetcher_skill]
kind = "workspace_file"
target = ".code2workspace/skills/respiratory-disease-data-fetcher/SKILL.md"
filename = "respiratory-disease-data-fetcher-SKILL.md"
base_file = ".code2workspace/skills/respiratory-disease-data-fetcher/SKILL.md"

[surfaces.virus_variation_skill]
kind = "workspace_file"
target = ".code2workspace/skills/virus-variation-query/SKILL.md"
filename = "virus-variation-query-SKILL.md"
base_file = ".code2workspace/skills/virus-variation-query/SKILL.md"

[surfaces.multi_source_report_skill]
kind = "workspace_file"
target = ".code2workspace/skills/multi-source-report/SKILL.md"
filename = "multi-source-report-SKILL.md"
base_file = ".code2workspace/skills/multi-source-report/SKILL.md"

