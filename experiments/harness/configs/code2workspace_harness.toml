[experiment]
name = "code2workspace-harness"
workspace_root = ".workspaces/oneshot"
output_root = "results/harness"
max_iterations = 3

# Optional smoke proposer:
#
# [proposer]
# command = [
#   "uv",
#   "run",
#   "--project",
#   "libs/cli",
#   "python",
#   "experiments/harness/proposers/noop_proposer.py",
# ]
# max_runtime_minutes = 10

# Preferred deepagents outer proposer:
#
# [better_agent]
# model = "gpt-5"
