target = "composite-skill"
name = "multi-source-report-structure"
prompt = "验证 multi-source-report 的 init 和 compose 结构是否稳定。"
required_env = []
expected_behaviors = []
expected_outputs = [
  "artifact:new-run-dir",
  "report-final-exists",
  "report-lane-count>=4",
  "report-sources-count>=4",
  "report-char-count>=5000",
  "report-meets-min-chars",
  "report-complete",
]
known_issues = []
timeout_minutes = 2
artifact_root = "results/skills/multi-source-report"
command = [
  "bash",
  "-lc",
  "set -euo pipefail\nRUN_DIR=$(python3 .code2workspace/skills/multi-source-report/scripts/report_tool.py init --topic \"结构测试多来源报告\" --report-mode general --min-report-chars 5000 | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"run_dir\"])')\nRUN_DIR=\"$RUN_DIR\" python3 - <<'PY'\nimport os\nfrom pathlib import Path\nrun_dir = Path(os.environ['RUN_DIR'])\nbody = {\n    '01_monitoring.md': ('Monitoring And Operational Evidence', 'respiratory-disease-wide-monitor', ['WHO dashboard', 'China CDC bulletin'], '官方监测证据显示不同地区对呼吸道活动、严重度和运行信号的表述存在时间差与地区差，因此需要做跨源综合判断。' * 40),\n    '02_source-catalog.md': ('Source Catalog And Coverage Evidence', 'epietl-api', ['EpiETL channels', 'official dashboards'], '来源目录证据解释了 source type、channel 组织方和覆盖范围，让报告能区分哪些地区是连续监测、哪些地区只是零散更新。' * 36),\n    '03_local-data.md': ('Local Structured Data Or Database Evidence', 'virus-variation-query', ['local DB'], '本地结构化数据证据可用于补充谱系、位点和数据库记录，但这些结果必须与监测和文献结合，不能单独当作结论。' * 36),\n    '04_literature-web.md': ('Literature, Technical, And Web Evidence', 'academic-search', ['PubMed'], '文献和技术证据提供机制解释、干预背景和研究进展，使报告不只停留在现象描述，而能扩展到原因和不确定性。' * 40),\n    '05_synthesis.md': ('Synthesis And Recommendations', 'multi-source-report', ['synthesized lane evidence'], '综合层需要明确哪些证据彼此支持、哪些证据互相冲突，以及哪些建议可以立刻执行、哪些只能持续观察。' * 36),\n}\nfor filename, payload in body.items():\n    title, skill, sources, text = payload\n    path = run_dir / 'lanes' / filename\n    path.write_text('# ' + title + '\\n\\n' + f'Skill: {skill}\\n' + '\\n'.join(f'Source: {s}' for s in sources) + '\\n' + text + '\\n', encoding='utf-8')\nPY\npython3 .code2workspace/skills/multi-source-report/scripts/report_tool.py compose --run-dir \"$RUN_DIR\" --summary \"Structure test summary with long-form multi-source content [1][2].\""
]
