target = "composite-skill"
name = "multi-source-report-behavior"
prompt = "请使用 $multi-source-report 做一次结构化行为验证：先初始化一个多来源报告目录，然后并行启动两个 `report-researcher` 子agent，分别负责 monitoring lane 和 literature lane。每个子agent只需基于各自相关的本地 skill 说明写出 2 到 3 行 lane note，不要做大范围联网检索，也不要写完整报告。最后只返回输出目录、你启动了哪些子agent，以及每个 lane 对应的文件名。"
required_env = []
expected_behaviors = [
  "tool:task",
  "tool-count:task>=2",
  "log:report-researcher",
]
expected_outputs = [
  "artifact:new-run-dir",
]
known_issues = []
timeout_minutes = 4
allow_timeout_after_expectations = true
artifact_root = "results/skills/multi-source-report"
