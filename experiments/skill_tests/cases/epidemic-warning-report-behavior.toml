target = "composite-skill"
name = "epidemic-warning-report-behavior"
prompt = "请按 epidemic-warning-report 的方式做一次结构化行为验证：先初始化一个疫情预警报告目录，然后并行调用两个不同角色的子agent，一个必须是 epidemic-monitor-analyst，一个必须是 epidemic-clinical-analyst。每个子agent只需基于各自 skill 说明写出 2 到 3 行 lane note，不要做大范围联网检索，也不要写完整报告。最后只返回输出目录和你启动了哪些子agent。"
required_env = []
expected_behaviors = [
  "tool:task",
  "tool-count:task>=2",
  "subagent-count>=2",
  "subagent:epidemic-monitor-analyst",
  "subagent:epidemic-clinical-analyst",
]
expected_outputs = [
  "artifact:new-run-dir",
]
known_issues = []
timeout_minutes = 4
allow_timeout_after_expectations = true
artifact_root = "results/skills/epidemic-warning-report"
