target = "composite-skill"
name = "multi-source-report-end-to-end"
prompt = "验证 multi-source-report 的多 lane 端到端生成：初始化目录，写入至少四个 evidence lane 和一个 synthesis lane，并 compose 出 final_report.md。"
required_env = []
expected_behaviors = []
expected_outputs = [
  "artifact:new-run-dir",
  "report-final-exists",
  "report-lane-count>=4",
  "report-sources-count>=4",
  "report-risk-level",
  "report-char-count>=5000",
  "report-meets-min-chars",
]
known_issues = []
timeout_minutes = 2
artifact_root = "results/skills/multi-source-report"
command = [
  "bash",
  "-lc",
  "set -euo pipefail\nRUN_DIR=$(python3 .code2workspace/skills/multi-source-report/scripts/report_tool.py init --topic \"端到端多来源风险报告\" --report-mode risk --min-report-chars 5000 | python3 -c 'import sys,json; print(json.load(sys.stdin)[\"run_dir\"])')\nRUN_DIR=\"$RUN_DIR\" python3 - <<'PY'\nimport os\nfrom pathlib import Path\nrun_dir = Path(os.environ['RUN_DIR'])\nbody = {\n    '01_monitoring.md': ('Monitoring And Operational Evidence', 'respiratory-disease-data-fetcher', ['China CDC monthly COVID report', 'WHO respiratory dashboard'], '监测层展示了不同地区对病例活动、监测口径和运行负荷的差异，因此需要在报告里同时写明趋势强弱、地区异质性和证据可信度。' * 40),\n    '02_source-catalog.md': ('Source Catalog And Coverage Evidence', 'epietl-api', ['EpiETL channels', 'official dashboards'], '来源目录层说明了 source type、channel 组织方和结构化来源的覆盖边界，有助于解释为什么某些地区信息更连续、某些地区只有片段更新。' * 36),\n    '03_local-data.md': ('Local Structured Data Or Database Evidence', 'virus-variation-query', ['local DB'], '本地结构化数据层用于提示数据库记录和局部风险信号，但结论必须谨慎，避免把局部数据直接上升为总体临床结论。' * 30),\n    '04_literature-web.md': ('Literature, Technical, And Web Evidence', 'academic-search', ['PubMed'], '文献和技术层补充了机制、疫苗、试验和中和证据，让报告从监测快照扩展为机制与干预并重的分析报告。' * 40),\n    '05_synthesis.md': ('Synthesis And Recommendations', 'multi-source-report', ['synthesized lane evidence'], '综合层应提出分级监测、重点通报、临床准备和数据缺口跟踪建议，并明确哪些行动是立即执行、哪些行动需要持续追踪。' * 36),\n}\nfor filename, payload in body.items():\n    title, skill, sources, text = payload\n    path = run_dir / 'lanes' / filename\n    path.write_text('# ' + title + '\\n\\n' + f'Skill: {skill}\\n' + '\\n'.join(f'Source: {s}' for s in sources) + '\\n' + text + '\\n', encoding='utf-8')\nPY\npython3 .code2workspace/skills/multi-source-report/scripts/report_tool.py compose --run-dir \"$RUN_DIR\" --risk-level Elevated --summary \"End-to-end report generation completed with multi-source long-form content [1][2].\""
]
